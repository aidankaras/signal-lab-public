name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: "30 13 * * 1"   # weekly: catch dependency drift
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pandas numpy scipy scikit-learn pyyaml pytest ruff
      - run: ruff check harness tests
      # experiments/ and forward/ are excluded from the style config, but must at least be
      # free of undefined names and unused code (pyflakes rules), and must compile
      - run: ruff check --isolated --select F --ignore F403,F405 experiments forward docs
      - run: python -m compileall -q experiments forward docs harness
      - run: python -m pytest -q   # synthetic data only; no network
