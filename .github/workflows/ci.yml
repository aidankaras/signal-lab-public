name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pandas numpy scipy scikit-learn pyyaml pytest ruff
      - run: ruff check harness tests
      - run: python -m pytest -q   # synthetic data only; no network
